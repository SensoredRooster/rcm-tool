name: Deploy Cloudflare Support Collector

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-support-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "9c5f81e73d237bab60bdb0bc2085cd56"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY || vars.CLOUDFLARE_API_KEY || secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
        run: |
          RAW="$(printf '%s' "$RAW_CLOUDFLARE_TOKEN" | tr -d '\r\n')"
          RAW="$(printf '%s' "$RAW" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TOKEN="$(printf '%s' "$RAW" | grep -oE 'cfat_[A-Za-z0-9_-]+' | head -n 1 || true)"
          if [ -z "$TOKEN" ]; then
            TOKEN="$RAW"
            TOKEN="${TOKEN#Bearer }"
            TOKEN="${TOKEN#bearer }"
            TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
            TOKEN="${TOKEN#CLOUDFLARE_API_KEY=}"
            TOKEN="${TOKEN#CF_API_TOKEN=}"
            TOKEN="${TOKEN#\"}"
            TOKEN="${TOKEN%\"}"
            TOKEN="${TOKEN#\'}"
            TOKEN="${TOKEN%\'}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "Cloudflare API token is empty after normalization."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify Cloudflare authentication
        working-directory: cloudflare/support-worker
        run: wrangler whoami

      - name: Ensure R2 bucket exists
        working-directory: cloudflare/support-worker
        run: wrangler r2 bucket create rcm-tool-support-logs || true

      - name: Deploy Worker
        working-directory: cloudflare/support-worker
        run: wrangler deploy

      - name: Verify deployed health endpoint
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://rcm-tool-support.sensoredrooster-com.workers.dev/health" | tee health.json; then
              grep -q '"ok":true' health.json
              break
            fi
            sleep 2
          done
          grep -q '"ok":true' health.json

      - name: Probe upload route through Cloudflare edge
        shell: bash
        run: |
          STATUS="$(curl --silent --output upload-probe.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/zip' \
            --header 'X-RCM-Session: ci-probe' \
            --header 'X-RCM-Filename: probe.zip' \
            --data-binary '' \
            'https://rcm-tool-support.sensoredrooster-com.workers.dev/upload')"
          cat upload-probe.json
          test "$STATUS" = "400"
          grep -q '"Empty bundle"' upload-probe.json

      - name: Probe Python urllib upload request
        shell: bash
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          url = "https://rcm-tool-support.sensoredrooster-com.workers.dev/upload"
          for label, headers in [
              ("default", {
                  "Content-Type": "application/zip",
                  "X-RCM-Session": "ci-python-default",
                  "X-RCM-Filename": "probe.zip",
              }),
              ("browser-headers", {
                  "Content-Type": "application/zip",
                  "X-RCM-Session": "ci-python-browser",
                  "X-RCM-Filename": "probe.zip",
                  "User-Agent": "RCMTool/1.0 (+https://github.com/SensoredRooster/rcm-tool)",
                  "Accept": "application/json",
              }),
          ]:
              request = urllib.request.Request(url, data=b"", method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print(label, response.status, response.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  print(label, exc.code, body)
                  if label == "browser-headers":
                      assert exc.code == 400 and "Empty bundle" in body
          PY
