name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check signal_lab support.py support_dialog.py gamepad_signal_lab.py rcm_tool.py
      - run: pyright support.py signal_lab/analysis.py signal_lab/sweep.py
      - run: python -m unittest discover -v
